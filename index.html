    /* =====================================================================
       Page behaviour
       ===================================================================== */

    let revealObserver;
    function observeReveals(root = document) {
      revealObserver ??= new IntersectionObserver(
        (entries) => entries.forEach((e) => {
          if (!e.isIntersecting) return;
          e.target.classList.add("is-visible");
          revealObserver.unobserve(e.target);
        }),
        { threshold: 0.15 },
      );
      root.querySelectorAll(".reveal:not(.is-visible)").forEach((el) => revealObserver.observe(el));
    }

    function initCountUps() {
      const io = new IntersectionObserver((entries) => entries.forEach((e) => {
        if (!e.isIntersecting) return;
        io.unobserve(e.target);
        const to = Number(e.target.dataset.count);
        const suffix = e.target.dataset.suffix;
        const start = performance.now();
        const step = (now) => {
          const k = Math.min(1, (now - start) / 1600);
          e.target.textContent = Math.round(to * (1 - Math.pow(1 - k, 3))) + suffix;
          if (k < 1) requestAnimationFrame(step);
        };
        requestAnimationFrame(step);
      }), { threshold: 0.4 });
      document.querySelectorAll("[data-count]").forEach((el) => io.observe(el));
    }

    function initPointerEffects() {
      document.querySelectorAll(".magnetic").forEach((el) => {
        el.addEventListener("pointermove", (e) => {
          if (e.pointerType !== "mouse") return;
          const r = el.getBoundingClientRect();
          el.style.transform = `translate(${(e.clientX - r.left - r.width / 2) * 0.3}px, ${(e.clientY - r.top - r.height / 2) * 0.3}px)`;
        });
        el.addEventListener("pointerleave", () => (el.style.transform = ""));
      });
      document.querySelectorAll(".tilt").forEach((el) => {
        el.addEventListener("pointermove", (e) => {
          if (e.pointerType !== "mouse") return;
          const r = el.getBoundingClientRect();
          const x = (e.clientX - r.left) / r.width - 0.5;
          const y = (e.clientY - r.top) / r.height - 0.5;
          el.style.transform = `perspective(900px) rotateY(${x * 16}deg) rotateX(${-y * 16}deg)`;
          el.style.setProperty("--gx", `${(x + 0.5) * 100}%`);
          el.style.setProperty("--gy", `${(y + 0.5) * 100}%`);
        });
        el.addEventListener("pointerleave", () => (el.style.transform = ""));
      });

      // Neon edge glow and spotlight on the card under the mouse
      if (window.matchMedia("(hover: hover) and (pointer: fine)").matches) {
        window.addEventListener("pointermove", (e) => {
          const card = e.target.closest?.(".panel");
          if (!card) return;
          const r = card.getBoundingClientRect();
          card.style.setProperty("--mx", `${e.clientX - r.left}px`);
          card.style.setProperty("--my", `${e.clientY - r.top}px`);
        }, { passive: true });
      }

      // Architect's cursor on mouse devices; phones, tablets and reduced motion keep the normal cursor
      if (window.matchMedia("(pointer: fine)").matches && !reducedMotion) startCursor(document.getElementById("cursor"));
    }

    /**
     * The architect's cursor: a CAD-style crosshair with live coordinates, corner
     * brackets that "select" 3D buildings, a frame that snaps around buttons and
     * links, a short label saying what a click will do, and a ripple on click.
     */
    function startCursor(root) {
      const SNAP = "a, button, summary, [role='button'], label:has(input[type='radio']), [data-cursor='snap']";
      const TEXT = "input:not([type='radio']):not([type='checkbox']), textarea, select, [contenteditable='true']";
      // Elements bigger than this get the "read" cursor instead of a snap frame
      const MAX_SNAP = { w: 640, h: 260 };
      const frame = root.querySelector(".cursor-frame");
      const cross = root.querySelector(".cursor-cross");
      const coords = root.querySelector(".cursor-coords");
      const label = root.querySelector(".cursor-label");
      const pointer = { x: -100, y: -100 };
      const box = { x: -100, y: -100, w: 12, h: 12, r: 6 };
      let cursorState = "hidden";
      let snapEl = null;
      let snapRadius = 0;
      let text = "";

      const snapLabel = (el) => {
        if (el.dataset?.cursorLabel) return el.dataset.cursorLabel;
        if (el.tagName === "A") {
          const href = el.getAttribute("href") ?? "";
          if (href.startsWith("#")) return "Go ↓";
          if (href.startsWith("mailto:")) return "Email";
          return "Open ↗";
        }
        return "Click";
      };
      const set = (next, nextText = "") => {
        if (next !== cursorState) {
          cursorState = next;
          root.dataset.state = next;
        }
        if (nextText !== text) {
          text = nextText;
          label.textContent = nextText;
        }
      };
      const inspect = (target) => {
        snapEl = null;
        if (!target?.closest) return set("hidden");
        if (target.closest(TEXT)) return set("text");
        const snap = target.closest(SNAP);
        if (snap) {
          const r = snap.getBoundingClientRect();
          if (r.width <= MAX_SNAP.w && r.height <= MAX_SNAP.h) {
            snapEl = snap;
            snapRadius = Math.min(parseFloat(getComputedStyle(snap).borderTopLeftRadius) || 8, r.height / 2) + 6;
            return set("snap", snapLabel(snap));
          }
        }
        // The 3D city marks project buildings under the pointer on <body>
        if (document.body.dataset.cursor === "hover") return set("select", "Open project ↗");
        if (target.closest("[data-cursor='hover']")) return set("select", "Open ↗");
        if (target.closest(".panel")) return set("read", "Read");
        return set("scroll", state.simple ? "" : "Scroll to fly ✈");
      };

      window.addEventListener("pointermove", (e) => {
        if (e.pointerType !== "mouse") return;
        pointer.x = e.clientX;
        pointer.y = e.clientY;
        inspect(e.target);
      }, { passive: true });
      window.addEventListener("pointerdown", () => {
        const ripple = document.createElement("span");
        ripple.className = "cursor-ripple";
        ripple.style.transform = `translate(${pointer.x}px, ${pointer.y}px)`;
        root.append(ripple);
        setTimeout(() => ripple.remove(), 600);
      });
      document.documentElement.addEventListener("pointerleave", () => set("hidden"));
      document.documentElement.classList.add("custom-cursor");

      (function loop() {
        let goal;
        if (cursorState === "snap" && snapEl?.isConnected) {
          const r = snapEl.getBoundingClientRect();
          goal = { x: r.left - 6, y: r.top - 6, w: r.width + 12, h: r.height + 12, r: snapRadius };
        } else if (cursorState === "select") {
          goal = { x: pointer.x - 24, y: pointer.y - 24, w: 48, h: 48, r: 3 };
        } else {
          goal = { x: pointer.x - 6, y: pointer.y - 6, w: 12, h: 12, r: 6 };
        }
        for (const k of ["x", "y", "w", "h", "r"]) box[k] += (goal[k] - box[k]) * 0.24;
        frame.style.transform = `translate(${box.x}px, ${box.y}px)`;
        frame.style.width = `${box.w}px`;
        frame.style.height = `${box.h}px`;
        frame.style.borderRadius = `${box.r}px`;
        cross.style.transform = `translate(${pointer.x}px, ${pointer.y}px)`;
        coords.textContent = `X ${String(Math.round(pointer.x)).padStart(4, "0")} · Y ${String(Math.round(pointer.y)).padStart(4, "0")}`;
        // Snapped: the label sits above the element; otherwise beside the pointer
        const snapped = cursorState === "snap";
        const lx = snapped ? box.x + box.w / 2 : pointer.x + 22;
        const ly = snapped ? box.y - 30 : pointer.y + 20;
        label.style.transform = `translate(${lx}px, ${ly}px) translateX(${snapped ? "-50%" : "0"})`;
        requestAnimationFrame(loop);
      })();
    }

    function initLocalTime() {
      const fmt = new Intl.DateTimeFormat("en-US", { timeZone: PROFILE.timeZone, hour: "numeric", minute: "2-digit" });
      const tick = () => document.querySelectorAll("[data-local-time]").forEach((el) => (el.textContent = fmt.format(Date.now())));
      tick();
      setInterval(tick, 15000);
    }

    function initNavbar() {
      const nav = document.getElementById("navbar");
      const menu = document.getElementById("mobile-menu");
      const button = document.getElementById("menu-button");
      const setOpen = (open) => {
        menu.hidden = !open;
        button.setAttribute("aria-expanded", String(open));
        button.innerHTML = icon(open ? "close" : "menu", "text-lg");
        onScroll();
      };
      const onScroll = () => {
        const solid = window.scrollY > 40 || !menu.hidden;
        ["border-line", "bg-panel", "backdrop-blur-xl"].forEach((c) => nav.classList.toggle(c, solid));
        nav.classList.toggle("border-transparent", !solid);
      };
      window.addEventListener("scroll", onScroll, { passive: true });
      onScroll();
      button.addEventListener("click", () => setOpen(menu.hidden));
      menu.querySelectorAll("[data-close-menu]").forEach((a) => a.addEventListener("click", () => setOpen(false)));
      document.querySelectorAll("[data-simple-toggle]").forEach((b) => b.addEventListener("click", () => setState({ simple: !state.simple })));
      document.querySelectorAll("[data-theme-toggle]").forEach((b) => b.addEventListener("click", switchTheme));
      updateThemeToggles();
    }

    /* ---------- Sunset / night switch ---------- */

    const SWITCH_SEEN_KEY = "mo-theme-switch-seen";
    let switchSeen = true;
    try {
      switchSeen = localStorage.getItem(SWITCH_SEEN_KEY) === "1";
    } catch {
      // Storage unavailable
    }
    const PILL = "group relative flex h-10 items-center gap-2 rounded-full border px-3.5 text-sm font-semibold transition-all duration-300 hover:scale-105";
    const PILL_NIGHT = "border-indigo-300/30 bg-linear-to-br from-[#2b2766] to-[#0b1220] text-white shadow-[0_0_22px_-6px_rgba(129,140,248,0.75)]";
    const PILL_SUNSET = "border-orange-200/50 bg-linear-to-br from-[#ffb26b] to-[#e0707c] text-[#2a1218] shadow-[0_0_22px_-6px_rgba(255,156,85,0.9)]";

    /** A labelled pill that previews the other look, with an animated icon and a pulse ring until it has been tried. */
    function updateThemeToggles() {
      const next = state.theme === "sunset" ? "night" : "sunset";
      const fresh = state.entered && !switchSeen;
      document.querySelectorAll("[data-theme-toggle]").forEach((b) => {
        b.className = `${PILL} ${next === "night" ? PILL_NIGHT : PILL_SUNSET}`;
        b.innerHTML =
          (fresh ? `<span class="absolute inset-0 animate-ping rounded-full border-2 border-current opacity-40" aria-hidden="true"></span>` : "") +
          icon(next === "night" ? "moon" : "sun", `text-lg ${next === "night" ? "moon-rock" : "animate-[spin_12s_linear_infinite]"}`) +
          `<span>${next === "night" ? "Night" : "Sunset"}</span>`;
        b.setAttribute("aria-label", `Switch to the ${next} city`);
        b.dataset.cursorLabel = "Change time ☀/☾";
        b.title = next === "night" ? "Night city" : "Sunset city";
      });
      document.querySelectorAll("[data-hint-text]").forEach((t) => (t.textContent = `Try the ${next} city ✨`));
    }

    /** Shows the one-time hint under the switch for a few seconds after entering the city. */
    function showThemeHint() {
      updateThemeToggles();
      if (switchSeen) return;
      const hint = document.querySelector("[data-theme-hint]");
      if (!hint) return;
      hint.hidden = false;
      setTimeout(() => (hint.hidden = true), 7000);
    }

    /** Fades a soft cover over the page while the city is rebuilt in the other theme. */
    function switchTheme() {
      const next = state.theme === "sunset" ? "night" : "sunset";
      switchSeen = true;
      try {
        localStorage.setItem(SWITCH_SEEN_KEY, "1");
      } catch {
        // Storage unavailable
      }
      document.querySelectorAll("[data-theme-hint]").forEach((h) => (h.hidden = true));
      const cover = document.getElementById("theme-cover");

      setTimeout(() => setState({ theme: next }), 380);
      setTimeout(() => cover.classList.replace("opacity-100", "opacity-0"), 1100);
    }

    function updateNavActive() {
      document.querySelectorAll("[data-nav]").forEach((a) => {
        const active = a.dataset.nav === state.activeSection;

    /* ---------- Smooth scrolling and section tracking ---------- */

    let lenis = null;
    function scrollToId(id) {
      const el = document.getElementById(id);
      if (!el) return;
      if (lenis) lenis.scrollTo(el, { duration: 2 });
      else el.scrollIntoView({ behavior: "smooth" });
    }

    function setupLenis() {
      if (state.simple) {
        lenis?.destroy();
        lenis = null;
        return;
      }
      if (lenis) return;
      lenis = new Lenis({ autoRaf: true, anchors: { duration: 2 }, lerp: 0.09 });
      if (!state.entered || state.openProject) lenis.stop();
    }

    function lockScroll() {
      if (state.entered) {
        lenis?.start();
        document.documentElement.style.overflow = "";
      } else {
        lenis?.stop();
        document.documentElement.style.overflow = "hidden";
      }
    }

    const clamp01 = (v) => Math.min(1, Math.max(0, v));
    function trackSections() {
      const vh = window.innerHeight;
      const atBottom = window.scrollY + vh >= document.documentElement.scrollHeight - 2;
      let progress = 0;
      let active = state.activeSection;
      SECTION_IDS.forEach((id, i) => {
        const el = document.getElementById(id);
        if (!el) return;
        const r = el.getBoundingClientRect();
        if (r.top <= 0) progress = i + clamp01(-r.top / r.height);
        scrollState.sections[id] = clamp01((vh * 0.5 - r.top) / r.height);
        if (r.top <= vh * 0.5 && r.bottom > vh * 0.5) active = id;
      });
      if (atBottom) progress = SECTION_IDS.length - 1;
      scrollState.progress = progress;
      setState({ activeSection: active });

      // Construction phase, matching the 3D build timeline
      const p = scrollState.sections.process ?? 0;
      renderProcess(p < 0.2 ? 0 : p < 0.35 ? 1 : p < 0.7 ? 2 : p < 0.82 ? 3 : 4);
      requestAnimationFrame(trackSections);
    }

    /* ---------- Loader ---------- */

    function initLoader() {
      const loader = document.getElementById("loader");
      const progressEl = document.getElementById("loader-progress");
      const messageEl = document.getElementById("loader-message");
      const enter = document.getElementById("enter");
      const MESSAGES = ["Drawing the blueprint…", "Laying the roads…", "Building the city…", "Switching on the lights…"];
      const start = performance.now();
      const step = (now) => {
        const k = Math.min(1, (now - start) / 2400);
        const progress = Math.round(100 * (1 - Math.pow(1 - k, 2)));
        progressEl.textContent = `${progress}%`;
        messageEl.textContent = progress >= 100 ? "The city is ready" : MESSAGES[Math.min(MESSAGES.length - 1, Math.floor(progress / 26))];
        if (progress >= 100) {
          enter.disabled = false;
          document.getElementById("skyline-fill").classList.add("is-on");
        }
        if (k < 1 && !state.entered) requestAnimationFrame(step);
      };
      requestAnimationFrame(step);
      enter.addEventListener("click", () => setState({ entered: true }));
      document.getElementById("enter-simple").addEventListener("click", () => setState({ simple: true, entered: true }));
      on("entered", () => {
        loader.classList.add("is-done");
        loader.setAttribute("aria-hidden", "true");
      });
    }

    function onEntered() {
      document.querySelectorAll("[data-show]").forEach((el) => {
        el.classList.remove("translate-y-6", "opacity-0");
        el.classList.add("translate-y-0", "opacity-100");
      });
      document.querySelectorAll(".letters").forEach((el) => el.classList.add("is-on"));
      document.getElementById("scroll-hint").classList.replace("opacity-0", "opacity-100");
      const dots = document.getElementById("dots");
      dots.classList.remove("pointer-events-none", "opacity-0");
      dots.classList.add("opacity-100");
      lockScroll();
      updateMinimap();
    }

    /* =====================================================================
       The 3D city
       ===================================================================== */

    const BRAND = "#2DD4BF";
    const BRAND_GLOW = "#5EEAD4";
    const AMBER = "#F59E0B";
    /**
     * How the city looks in each theme.
     * sunset: golden hour, dark glass towers on a cream city, soft warm accents.
     * night: the neon city under the moon.
     */
    const THEMES = {
      sunset: {
        fog: { color: "#e9a383", near: 150, far: 560 },
        sky: { zenith: "#3a3463", mid: "#d9787c", horizon: "#ff9c55", band: 0 },
        ground: "#ece3d3",
        road: "#d4c9b9",
        desert: { sand: "#e0b07c", crest: "#f4d3a3", rock: "#9a5a45", mesa: "#b8644a", cactus: "#4d6a3a", shrub: "#8c7a4c", beach: "#f2d8b0", wet: "#b48c6c" },
        sea: { deep: "#2f3558", shallow: "#4f8592", sky: "#f2a27c", glitter: "#ffd9a0", foam: 0.7 },
        roadLine: { color: "#b3a48f", strength: 1, opacity: 0.7 },
        building: "#111318",
        tower: "#121419",
        glassTint: "#2d2b34",
        facade: { roughness: 0.45, metalness: 0.6, paneRoughness: 0.05, paneMetal: 1, tint: 1, pane: [0.06, 0.1, 0.92] },
        windows: { color: "#FFD9A0", intensity: 1.1, lit: 0.07 },
        edge: "#FFD8A8",
        glow: 0.55,
        lamp: 2.2,
        carStrip: false,
        ambient: 0.25,
        hemi: { sky: "#ffe6cf", ground: "#f3ebdf", intensity: 0.6 },
        sun: { color: "#ffcf9e", intensity: 2.6, height: 62 },
        shadows: true,
        environment: 0.9,
        celestial: { kind: "sun", dir: [-0.36, 0.028, -0.93], scale: 260, color: "#fff2d6", strength: 3.2, halo: "#ff9a4d", haloStrength: 1.4 },
        clouds: { dark: "#7d5168", lit: "#ffd2a6", falloff: 170 },
        mountains: { near: ["#3b2634", "#5c3644"], far: ["#93545e", "#c0716e"] },
        stars: false,
        bloom: { strength: 0.35, radius: 0.45, threshold: 0.95 },
        toneMapping: THREE.ACESFilmicToneMapping,
        exposure: 1.05,
        vignette: 0.45,
      },
      night: {
        fog: { color: "#0B1220", near: 90, far: 330 },
        sky: { zenith: "#03060d", mid: "#0a1628", horizon: "#163552", band: 0.55 },
        ground: "#0D1526",
        road: "#16213A",
        desert: { sand: "#141b2b", crest: "#1e2a3f", rock: "#1d2232", mesa: "#252b3d", cactus: "#18291f", shrub: "#1c2330", beach: "#1d2638", wet: "#111a28" },
        sea: { deep: "#040a14", shallow: "#0b2436", sky: "#163552", glitter: "#d6e4ff", foam: 0.35 },
        roadLine: { color: BRAND, strength: 1.2, opacity: 0.35 },
        building: "#1E293B",
        tower: "#22324A",
        glassTint: "#1E293B",
        facade: { roughness: 0.85, metalness: 0.1, paneRoughness: 0.85, paneMetal: 0.1, tint: 0, pane: [0.22, 0.28, 0.78] },
        windows: { color: "#FDE68A", intensity: 2.2, lit: 0.38 },
        edge: BRAND,
        glow: 1,
        lamp: 3,
        carStrip: true,
        ambient: 0.35,
        hemi: { sky: "#1D3557", ground: "#0B1220", intensity: 0.35 },
        sun: { color: "#8FB6FF", intensity: 0.6, position: [80, 140, 40] },
        shadows: false,
        environment: 0,
        celestial: { kind: "moon", dir: [-0.36, 0.06, -0.93], scale: 150, color: "#E6EEFF", strength: 1.7, halo: "#E6EEFF", haloStrength: 1 },
        clouds: { dark: "#1b2539", lit: "#cbd7f0", falloff: 75 },
        mountains: { near: ["#070b15", "#0b1322"], far: ["#0a1220", "#11203a"] },
        stars: true,
        bloom: { strength: 0.45, radius: 0.25, threshold: 1.0 },
        toneMapping: THREE.NoToneMapping,
        exposure: 1,
        vignette: 0.65,
      },
    };
    /** The theme the city is currently built with. */
    let T = THEMES.sunset;
    /** Neon colour pushed above 1.0 so the bloom pass makes it glow (softer in the sunset theme). */
    const glow = (hex, strength = 2.5) => new THREE.Color(hex).multiplyScalar(strength * T.glow);

    function seeded(seed) {
      let a = seed >>> 0;
      return () => {
        a = (a + 0x6d2b79f5) >>> 0;
        let t = a;
        t = Math.imul(t ^ (t >>> 15), t | 1);
        t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    }

    const city = { started: false, running: false, teardown: null, onSubmitted: null };
    /** Per-frame callbacks: (time, delta) => void */
    const updaters = [];
    const tick = (fn) => updaters.push(fn);

    function startCity() {
      if (city.started) {
        city.running = true;
        return;
      }
      city.started = true;
      city.running = true;
      buildCity();
    }

    /** Rebuilds the city, e.g. after switching theme. */
    function rebuildCity() {
      if (!city.started) return;
      city.teardown();
      city.started = false;
      if (!state.simple) startCity();
    }

    function buildCity() {
      T = THEMES[state.theme] ?? THEMES.sunset;
      const quality = window.matchMedia("(max-width: 768px), (pointer: coarse)").matches ? "low" : "high";
      const abort = new AbortController();
      const host = document.getElementById("city");
      const renderer = new THREE.WebGLRenderer({ antialias: quality === "low", powerPreference: "high-performance" });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, quality === "high" ? 1.75 : 1.25));
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = T.exposure;
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      host.prepend(renderer.domElement);

      const scene = new THREE.Scene();
      scene.background = new THREE.Color(T.fog.color);
      scene.fog = new THREE.Fog(T.fog.color, T.fog.near, T.fog.far);
      const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.5, 1000);
      camera.position.set(120, 62, 140);

      scene.add(new THREE.AmbientLight(0xffffff, T.ambient));
      scene.add(new THREE.HemisphereLight(T.hemi.sky, T.hemi.ground, T.hemi.intensity));
      const sun = new THREE.DirectionalLight(T.sun.color, T.sun.intensity);
      // At sunset the light comes from the sun's direction, a little higher so the long shadows still reach the streets
      const [dx, , dz] = T.celestial.dir;
      if (T.sun.position) sun.position.set(...T.sun.position);
      else sun.position.set(dx * 240, T.sun.height, dz * 240);
      scene.add(sun);

      const shadows = T.shadows && quality === "high";
      if (shadows) {
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFShadowMap;
        sun.castShadow = true;
        sun.shadow.mapSize.set(2048, 2048);
        Object.assign(sun.shadow.camera, { left: -170, right: 170, top: 170, bottom: -170, near: 10, far: 700 });
        sun.shadow.bias = -0.0004;
        sun.shadow.normalBias = 0.06;
      }

      windowUniforms.uWindowColor.value.set(T.windows.color);
      windowUniforms.uWindowIntensity.value = T.windows.intensity;
      windowUniforms.uLitRatio.value = T.windows.lit;
      windowUniforms.uPaneRoughness.value = T.facade.paneRoughness;
      windowUniforms.uPaneMetal.value = T.facade.paneMetal;
      windowUniforms.uPaneTint.value.set(T.glassTint);
      windowUniforms.uPaneTintMix.value = T.facade.tint;
      windowUniforms.uPaneInset.value.set(...T.facade.pane);

      let composer = null;
      if (quality === "high") {
        composer = new EffectComposer(renderer);
        composer.addPass(new RenderPass(scene, camera));
        composer.addPass(new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), T.bloom.strength, T.bloom.radius, T.bloom.threshold));
        const vignette = new ShaderPass(VignetteShader);
        vignette.uniforms.darkness.value = T.vignette;
        composer.addPass(vignette);
        composer.addPass(new OutputPass());
        // Night keeps the neon colours untouched; sunset gets a filmic curve
        renderer.toneMapping = T.toneMapping;
      }

      window.addEventListener("resize", () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
        composer?.setSize(window.innerWidth, window.innerHeight);
      }, { signal: abort.signal });

      const world = { scene, camera, quality, renderer, signal: abort.signal };
      addSky(world);
      if (T.stars) addStars(world);
      addGround(world);
      addDesert(world);
      addBeach(world);
      addBuildings(world);
      addTraffic(world);
      addFounderTower(world);
      addLandmarks(world);
      addInfrastructure(world);
      addHighway(world);
      addConstruction(world);
      addSquare(world);
      addParks(world);
      addPlot(world);
      addFireworks(world);
      addCameraRig(world);
      document.fonts?.ready.then(() => signs.forEach((redraw) => redraw()));
      if (state.submitted) city.onSubmitted?.(state.submitted);

      // Long shadows across the cream streets
      if (shadows) {
        scene.traverse((o) => {
          if (!o.isMesh || !o.material?.isMeshStandardMaterial) return;
          o.receiveShadow = true;
          o.castShadow = !o.userData.ground;
        });
      }

      const timer = new THREE.Timer();
      renderer.setAnimationLoop(() => {
        timer.update();
        if (!city.running) return;
        const delta = timer.getDelta();
        const t = timer.getElapsed();
        for (const fn of updaters) fn(t, delta);
        if (composer) composer.render(delta);
        else renderer.render(scene, camera);
      });

      city.teardown = () => {
        abort.abort();
        renderer.setAnimationLoop(null);
        scene.traverse((o) => {
          o.geometry?.dispose();
          for (const m of [].concat(o.material ?? [])) {
            m.map?.dispose();
            m.dispose();
          }
        });
        scene.environment?.dispose();
        composer?.dispose();
        renderer.dispose();
        renderer.forceContextLoss();
        renderer.domElement.remove();
        updaters.length = 0;
        projectSites.length = 0;
        signs.length = 0;
        windowMaterials.clear();
        document.getElementById("city-labels").innerHTML = "";
        city.onSubmitted = null;
        delete document.body.dataset.cursor;
      };
    }

    /** Pmndrs-style vignette with a little film noise. */
    const VignetteShader = {
      uniforms: { tDiffuse: { value: null }, offset: { value: 0.25 }, darkness: { value: 0.65 } },
      vertexShader: `varying vec2 vUv; void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
      fragmentShader: `
        uniform sampler2D tDiffuse; uniform float offset, darkness; varying vec2 vUv;
        float rand(vec2 co) { return fract(sin(dot(co, vec2(12.9898, 78.233))) * 43758.5453); }
        void main() {
          vec4 c = texture2D(tDiffuse, vUv);
          float d = distance(vUv, vec2(0.5));
          c.rgb *= smoothstep(0.8, offset * 0.799, d * (darkness + offset));
          c.rgb += (rand(vUv * 913.0) - 0.5) * 0.035 * c.rgb;
          gl_FragColor = c;
        }`,
    };

    /* ---------- Shared building parts ---------- */

    const windowUniforms = {
      uWindowColor: { value: new THREE.Color("#FDE68A") },
      uWindowIntensity: { value: 2.2 },
      uLitRatio: { value: 0.38 },
      // Glass panes: smoother and more metallic than the facade, so they mirror the sky
      uPaneRoughness: { value: 0.85 },
      uPaneMetal: { value: 0.1 },
      uPaneTint: { value: new THREE.Color("#1E293B") },
      uPaneTintMix: { value: 0 },
      // Pane edges in each window cell (side inset, bottom, top): thin frames read as a glass curtain wall
      uPaneInset: { value: new THREE.Vector3(0.22, 0.28, 0.78) },
    };

    /** Standard material that draws glass windows (some lit) on vertical faces from world position. */
    function createWindowMaterial(color) {
      const material = new THREE.MeshStandardMaterial({ color, roughness: T.facade.roughness, metalness: T.facade.metalness, envMapIntensity: 1.2 });
      material.onBeforeCompile = (shader) => {
        Object.assign(shader.uniforms, windowUniforms);
        shader.vertexShader = shader.vertexShader
          .replace("#include <common>", "#include <common>\nvarying vec3 vWPos;\nvarying vec3 vWNormal;")
          .replace("#include <worldpos_vertex>", `#include <worldpos_vertex>
            vec4 wBase = vec4(transformed, 1.0);
            vec3 wNormal = objectNormal;
            #ifdef USE_INSTANCING
              wBase = instanceMatrix * wBase;
              wNormal = mat3(instanceMatrix) * wNormal;
            #endif
            vWPos = (modelMatrix * wBase).xyz;
            vWNormal = normalize(mat3(modelMatrix) * wNormal);`);
        shader.fragmentShader = shader.fragmentShader
          .replace("#include <common>", `#include <common>
            varying vec3 vWPos; varying vec3 vWNormal;
            uniform vec3 uWindowColor; uniform float uWindowIntensity; uniform float uLitRatio;
            uniform float uPaneRoughness; uniform float uPaneMetal; uniform vec3 uPaneTint; uniform float uPaneTintMix; uniform vec3 uPaneInset;`)
          .replace("#include <color_fragment>", `#include <color_fragment>
            float vertical = 1.0 - step(0.5, abs(vWNormal.y));
            bool faceX = abs(vWNormal.x) > 0.5;
            vec2 grid = vec2((faceX ? vWPos.z : vWPos.x) / 1.3, vWPos.y / 1.9);
            vec2 cell = fract(grid);
            float pane = step(uPaneInset.x, cell.x) * step(cell.x, 1.0 - uPaneInset.x) * step(uPaneInset.y, cell.y) * step(cell.y, uPaneInset.z);
            float glass = pane * vertical * step(1.4, vWPos.y);
            diffuseColor.rgb = mix(diffuseColor.rgb, uPaneTint, glass * uPaneTintMix);`)
          .replace("#include <roughnessmap_fragment>", `#include <roughnessmap_fragment>
            roughnessFactor = mix(roughnessFactor, uPaneRoughness, glass);`)
          .replace("#include <metalnessmap_fragment>", `#include <metalnessmap_fragment>
            metalnessFactor = mix(metalnessFactor, uPaneMetal, glass);`)
          .replace("#include <emissivemap_fragment>", `#include <emissivemap_fragment>
            {
              float side = floor(faceX ? vWPos.x : vWPos.z);
              float h = fract(sin(dot(floor(grid) + side * 0.37, vec2(12.9898, 78.233))) * 43758.5453);
              float lit = step(1.0 - uLitRatio, h);
              totalEmissiveRadiance += uWindowColor * glass * lit * uWindowIntensity * (0.55 + 0.45 * h);
            }`);
      };
      material.customProgramCacheKey = () => "city-windows";
      return material;
    }

    const windowMaterials = new Map();
    function windowBox(size, position, color = T.building) {
      if (!windowMaterials.has(color)) windowMaterials.set(color, createWindowMaterial(color));
      const mesh = new THREE.Mesh(new THREE.BoxGeometry(...size), windowMaterials.get(color));
      mesh.position.set(...position);
      return mesh;
    }

    const basic = (color, extra = {}) => new THREE.MeshBasicMaterial({ color, toneMapped: false, ...extra });
    const standard = (color, extra = {}) => new THREE.MeshStandardMaterial({ color, ...extra });
    function mesh(geometry, material, position = [0, 0, 0], rotation) {
      const m = new THREE.Mesh(geometry, material);
      m.position.set(...position);
      if (rotation) m.rotation.set(...rotation);
      return m;
    }

    function cornerGlow(w, h, d, y, strength = 2.4, thickness = 0.22) {
      const g = new THREE.Group();
      const mat = basic(glow(T.edge, strength));
      const geo = new THREE.BoxGeometry(thickness, h, thickness);
      for (const [x, z] of [[w / 2, d / 2], [-w / 2, d / 2], [w / 2, -d / 2], [-w / 2, -d / 2]]) g.add(mesh(geo, mat, [x, y, z]));
      return g;
    }

    /* Signs are drawn on canvases; they redraw once the web fonts have loaded */
    const signs = [];
    function canvasTexture(width, height, draw) {
      const canvas = document.createElement("canvas");
      canvas.width = width;
      canvas.height = height;
      const texture = new THREE.CanvasTexture(canvas);
      texture.colorSpace = THREE.SRGBColorSpace;
      texture.anisotropy = 4;
      const redraw = () => {
        const ctx = canvas.getContext("2d");
        ctx.clearRect(0, 0, width, height);
        draw(ctx, width, height, { display: "'Space Grotesk', sans-serif", body: "Inter, sans-serif" });
        texture.needsUpdate = true;
      };
      redraw();
      signs.push(redraw);
      return { texture, redraw };
    }

    function drawSign(ctx, w, h, fonts, { eyebrow, title, lines = [] }) {
      ctx.beginPath();
      ctx.roundRect(6, 6, w - 12, h - 12, 28);
      ctx.fillStyle = "rgba(8, 15, 28, 0.88)";
      ctx.fill();
      ctx.lineWidth = 8;
      ctx.strokeStyle = BRAND;
      ctx.stroke();
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      const blockH = (eyebrow ? 46 : 0) + 80 + lines.length * 46;
      let y = h / 2 - blockH / 2;
      if (eyebrow) {
        ctx.fillStyle = BRAND;
        ctx.font = `600 34px ${fonts.body}`;
        ctx.fillText(eyebrow.toUpperCase(), w / 2, y + 20);
        y += 46;
      }
      ctx.fillStyle = "#F8FAFC";
      ctx.font = `700 ${Math.min(76, (w * 1.6) / Math.max(title.length, 6))}px ${fonts.display}`;
      ctx.fillText(title, w / 2, y + 40);
      y += 80;
      ctx.fillStyle = "#CBD5E1";
      ctx.font = `400 36px ${fonts.body}`;
      for (const line of lines) {
        ctx.fillText(line, w / 2, y + 23, w - 80);
        y += 46;
      }
    }

    function sign({ title, eyebrow, lines, width, aspect = 2.5, position, rotation }) {
      const px = 1024;
      const text = { title, eyebrow, lines };
      const { texture, redraw } = canvasTexture(px, Math.round(px / aspect), (ctx, w, h, fonts) => drawSign(ctx, w, h, fonts, text));
      const m = mesh(new THREE.PlaneGeometry(width, width / aspect), basic(0xffffff, { map: texture, transparent: true, side: THREE.DoubleSide }), position, rotation);
      m.userData.setText = (patch) => {
        Object.assign(text, patch);
        redraw();
      };
      return m;
    }

    /** Pulsing light beam that marks a project building. */
    function liveBeacon(height) {
      const group = new THREE.Group();
      group.position.y = height;
      const orb = mesh(new THREE.SphereGeometry(0.7, 16, 16), basic(glow(BRAND, 4)));
      const beamMat = basic(glow(BRAND, 1.6), { transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, side: THREE.DoubleSide });
      group.add(orb, mesh(new THREE.CylinderGeometry(0.35, 0.9, 44, 12, 1, true), beamMat, [0, 22, 0]));
      return {
        group,
        update(t, active, highlighted) {
          const pulse = 0.5 + 0.5 * Math.sin(t * 3);
          const base = !active ? 0.04 : highlighted ? 0.55 : 0.22;
          beamMat.opacity = base + pulse * base * 0.4;
          orb.scale.setScalar((active ? 1 : 0.5) * (1 + pulse * 0.35) * (highlighted ? 1.5 : 1));
        },
      };
    }

    /* ---------- Night sky ---------- */

    const DOME_RADIUS = 800;
    const ORIGIN = new THREE.Vector3();
    const UP = new THREE.Vector3(0, 1, 0);
    const skyTime = { value: 0 };
    const NOISE = `
      float hash(vec3 p) { p = fract(p * 0.3183099 + 0.1); p *= 17.0; return fract(p.x * p.y * p.z * (p.x + p.y + p.z)); }
      float noise(vec3 x) {
        vec3 i = floor(x); vec3 f = fract(x); f = f * f * (3.0 - 2.0 * f);
        return mix(mix(mix(hash(i), hash(i + vec3(1, 0, 0)), f.x), mix(hash(i + vec3(0, 1, 0)), hash(i + vec3(1, 1, 0)), f.x), f.y),
                   mix(mix(hash(i + vec3(0, 0, 1)), hash(i + vec3(1, 0, 1)), f.x), mix(hash(i + vec3(0, 1, 1)), hash(i + vec3(1, 1, 1)), f.x), f.y), f.z);
      }
      float fbm(vec3 p) { float a = 0.5, s = 0.0; for (int i = 0; i < 4; i++) { s += a * noise(p); p *= 2.03; a *= 0.5; } return s; }
    `;
    const UV_VERTEX = `varying vec2 vUv; void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`;

    /** Sky dome, sun or moon, clouds, stars (night) and the mountain rings. */
    function addSky({ scene, camera, quality, renderer }) {
      const MOON_DIR = new THREE.Vector3(...T.celestial.dir).normalize();
      const sky = new THREE.Group();
      scene.add(sky);

      const dome = new THREE.Mesh(new THREE.SphereGeometry(DOME_RADIUS, 48, 24), new THREE.ShaderMaterial({
        side: THREE.BackSide,
        depthWrite: false,
        uniforms: {
          uZenith: { value: new THREE.Color(T.sky.zenith) },
          uMid: { value: new THREE.Color(T.sky.mid) },
          uHorizon: { value: new THREE.Color(T.sky.horizon) },
          uGround: { value: new THREE.Color(T.fog.color) },
          uBand: { value: new THREE.Color("#3a4d78").multiplyScalar(T.sky.band) },
        },
        vertexShader: `varying vec3 vDir; void main() { vDir = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
        fragmentShader: `
          uniform vec3 uZenith, uMid, uHorizon, uGround, uBand;
          varying vec3 vDir;
          ${NOISE}
          void main() {
            vec3 d = normalize(vDir);
            float h = d.y;
            vec3 col = mix(uHorizon, uMid, smoothstep(0.0, 0.2, h));
            col = mix(col, uZenith, smoothstep(0.2, 0.8, h));
            col = mix(uGround, col, smoothstep(-0.04, 0.01, h));
            float band = dot(d, normalize(vec3(0.35, 0.55, -0.76)));
            float core = exp(-pow(band / 0.17, 2.0)) * smoothstep(0.35, 0.85, fbm(d * 6.0) + 0.25);
            float dust = smoothstep(0.55, 0.75, fbm(d * 14.0 + 3.0));
            col += uBand * core * (1.0 - 0.6 * dust) * smoothstep(0.0, 0.25, h);
            gl_FragColor = vec4(col, 1.0);
            #include <tonemapping_fragment>
            #include <colorspace_fragment>
          }`,
      }));
      dome.renderOrder = -2;
      dome.frustumCulled = false;
      sky.add(dome);

      const moonQuat = new THREE.Quaternion().setFromRotationMatrix(new THREE.Matrix4().lookAt(ORIGIN, MOON_DIR, UP));
      const moon = new THREE.Mesh(new THREE.PlaneGeometry(), new THREE.ShaderMaterial({
        transparent: true,
        depthWrite: false,
        blending: THREE.AdditiveBlending,
        uniforms: {
          uColor: { value: new THREE.Color(T.celestial.color).multiplyScalar(T.celestial.strength) },
          uHalo: { value: new THREE.Color(T.celestial.halo).multiplyScalar(T.celestial.strength * 0.5 * T.celestial.haloStrength) },
          uCraters: { value: T.celestial.kind === "moon" ? 1 : 0 },
        },
        vertexShader: UV_VERTEX,
        fragmentShader: `
          uniform vec3 uColor, uHalo; uniform float uCraters; varying vec2 vUv;
          ${NOISE}
          void main() {
            vec2 p = vUv * 2.0 - 1.0;
            float r = length(p);
            float R = 0.2;
            float disc = smoothstep(R, R - 0.012, r);
            vec2 q = p / R;
            float maria = fbm(vec3(q * 2.2, 1.7));
            float shade = 1.0 - 0.38 * uCraters * smoothstep(0.45, 0.7, maria);
            float limb = sqrt(max(0.0, 1.0 - dot(q, q)));
            vec3 moon = uColor * shade * (0.7 + 0.3 * limb);
            float out_ = max(r - R, 0.0);
            float halo = (exp(-out_ * 9.0) * 0.4 + exp(-out_ * 2.6) * 0.12) * smoothstep(1.0, 0.6, r);
            gl_FragColor = vec4(moon * disc + uHalo * halo * (1.0 - disc), 1.0);
          }`,
      }));
      moon.position.copy(MOON_DIR).multiplyScalar(DOME_RADIUS - 80);
      moon.quaternion.copy(moonQuat);
      moon.scale.setScalar(T.celestial.scale);
      moon.renderOrder = -1;
      sky.add(moon);

      // Moonlit clouds drifting across the moon
      [
        { w: 560, h: 150, speed: 0.035, seed: 3.1, distance: DOME_RADIUS - 140, lift: -6 },
        { w: 420, h: 110, speed: 0.06, seed: 8.7, distance: DOME_RADIUS - 170, lift: 8 },
      ].forEach((c, i) => {
        const cloud = new THREE.Mesh(new THREE.PlaneGeometry(), new THREE.ShaderMaterial({
          transparent: true,
          depthWrite: false,
          uniforms: {
            uTime: skyTime,
            uSize: { value: new THREE.Vector2(c.w, c.h) },
            uSpeed: { value: c.speed },
            uSeed: { value: c.seed },
            uDark: { value: new THREE.Color(T.clouds.dark) },
            uLit: { value: new THREE.Color(T.clouds.lit) },
            uFalloff: { value: T.clouds.falloff },
          },
          vertexShader: UV_VERTEX,
          fragmentShader: `
            uniform float uTime, uSpeed, uSeed, uFalloff; uniform vec2 uSize; uniform vec3 uDark, uLit; varying vec2 vUv;
            ${NOISE}
            void main() {
              vec2 world = (vUv - 0.5) * uSize;
              vec2 p = world / 38.0 + vec2(uTime * uSpeed, uSeed);
              float warp = fbm(vec3(p * 0.6, uTime * 0.01));
              float density = smoothstep(0.34, 0.68, fbm(vec3(p * vec2(1.0, 2.2) + warp * 1.6, uSeed + uTime * 0.015)));
              float edge = smoothstep(0.0, 0.18, vUv.x) * smoothstep(1.0, 0.82, vUv.x) * smoothstep(0.0, 0.3, vUv.y) * smoothstep(1.0, 0.7, vUv.y);
              float moonlight = exp(-max(length(world) - 12.0, 0.0) / uFalloff);
              vec3 col = mix(uDark, uLit, moonlight * (0.35 + 0.65 * (1.0 - density)));
              gl_FragColor = vec4(col, density * edge * 0.92);
              #include <tonemapping_fragment>
              #include <colorspace_fragment>
            }`,
        }));
        cloud.position.copy(MOON_DIR).multiplyScalar(c.distance);
        cloud.position.y = MOON_DIR.y * c.distance + c.lift;
        cloud.quaternion.copy(moonQuat);
        cloud.scale.set(c.w, c.h, 1);
        cloud.renderOrder = i;
        sky.add(cloud);
      });

      // Bright twinkling stars that catch the bloom (night only)
      const count = T.stars ? (quality === "high" ? 90 : 40) : 0;
      const rand = seeded(77);
      const positions = new Float32Array(count * 3);
      const phases = new Float32Array(count);
      const dir = new THREE.Vector3();
      for (let i = 0; i < count; i++) {
        dir.set(rand() * 2 - 1, 0.1 + rand() * 0.9, rand() * 2 - 1).normalize().multiplyScalar(DOME_RADIUS - 60);
        dir.toArray(positions, i * 3);
        phases[i] = rand() * Math.PI * 2;
      }
      const starGeo = new THREE.BufferGeometry();
      starGeo.setAttribute("position", new THREE.BufferAttribute(positions, 3));
      starGeo.setAttribute("aPhase", new THREE.BufferAttribute(phases, 1));
      const bright = new THREE.Points(starGeo, new THREE.ShaderMaterial({
        transparent: true,
        depthWrite: false,
        blending: THREE.AdditiveBlending,
        uniforms: { uTime: skyTime, uColor: { value: new THREE.Color("#F1F5FF").multiplyScalar(2.2) } },
        vertexShader: `
          uniform float uTime; attribute float aPhase; varying float vTwinkle;
          void main() {
            vTwinkle = 0.55 + 0.45 * sin(uTime * (1.2 + fract(aPhase) * 1.6) + aPhase);
            gl_PointSize = 2.0 + 2.5 * vTwinkle;
            gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
          }`,
        fragmentShader: `
          uniform vec3 uColor; varying float vTwinkle;
          void main() {
            float d = length(gl_PointCoord - 0.5) * 2.0;
            gl_FragColor = vec4(uColor * vTwinkle * smoothstep(1.0, 0.0, d), 1.0);
          }`,
      }));
      bright.renderOrder = -1;
      bright.frustumCulled = false;
      sky.add(bright);

      // Shooting stars
      if (T.stars && !reducedMotion) {
        const srand = seeded(5);
        const plane = new THREE.PlaneGeometry(1, 1);
        const look = new THREE.Matrix4();
        const streaks = Array.from({ length: quality === "high" ? 2 : 1 }, (_, i) => {
          const material = new THREE.ShaderMaterial({
            transparent: true,
            depthWrite: false,
            blending: THREE.AdditiveBlending,
            uniforms: { uFade: { value: 0 }, uColor: { value: new THREE.Color("#E0F2FE").multiplyScalar(3) } },
            vertexShader: UV_VERTEX,
            fragmentShader: `
              uniform float uFade; uniform vec3 uColor; varying vec2 vUv;
              void main() {
                float a = pow(vUv.x, 3.0) * (1.0 - abs(vUv.y * 2.0 - 1.0)) * uFade;
                gl_FragColor = vec4(uColor * a, 1.0);
              }`,
          });
          const m = new THREE.Mesh(plane, material);
          m.scale.set(80, 0.9, 1);
          m.frustumCulled = false;
          sky.add(m);
          return { mesh: m, material, t: 1, wait: 2 + i * 4 };
        });
        const launch = (s) => {
          const p = new THREE.Vector3(srand() * 2 - 1, 0.45 + srand() * 0.5, srand() * 2 - 1).normalize().multiplyScalar(DOME_RADIUS - 100);
          s.mesh.position.copy(p);
          look.lookAt(ORIGIN, p, UP);
          s.mesh.quaternion.setFromRotationMatrix(look);
          s.mesh.rotateZ(-0.5 - srand() * 2.1);
          s.t = 0;
          s.wait = 3 + srand() * 7;
        };
        tick((_, dt) => {
          for (const s of streaks) {
            if (s.wait > 0) {
              s.wait -= dt;
              if (s.wait <= 0) launch(s);
              s.material.uniforms.uFade.value = 0;
              continue;
            }
            s.t += dt / 0.9;
            s.mesh.translateX(dt * 320);
            s.material.uniforms.uFade.value = Math.sin(Math.min(s.t, 1) * Math.PI);
            if (s.t >= 1) s.wait = 4 + srand() * 8;
          }
        });
      }

      // Mountain rings around the city
      const mountainRing = (radius, minH, maxH, seed) => {
        const r = seeded(seed);
        const waves = Array.from({ length: 6 }, (_, i) => ({ f: 2 + i * 3 + Math.floor(r() * 3), p: r() * 6.28, a: 1 / (i + 1) }));
        const segments = 240;
        const pos = [];
        const shade = [];
        for (let i = 0; i <= segments; i++) {
          const t = (i / segments) * Math.PI * 2;
          let n = 0;
          for (const w of waves) n += Math.sin(t * w.f + w.p) * w.a;
          const x = Math.cos(t) * radius;
          const z = Math.sin(t) * radius;
          // The mountains open up over the sea, so the water runs to the horizon
          const h = THREE.MathUtils.lerp(Math.max(minH * 0.4, minH + (maxH - minH) * (0.5 + n / 4.5)), -8, seaSector(x, z));
          pos.push(x, -8, z, x, h, z);
          shade.push(0, 1);
        }
        const index = [];
        for (let i = 0; i < segments; i++) {
          const a = i * 2;
          index.push(a, a + 1, a + 2, a + 1, a + 3, a + 2);
        }
        const g = new THREE.BufferGeometry();
        g.setAttribute("position", new THREE.Float32BufferAttribute(pos, 3));
        g.setAttribute("aShade", new THREE.Float32BufferAttribute(shade, 1));
        g.setIndex(index);
        return g;
      };
      const mountainMaterial = (base, peak) => new THREE.ShaderMaterial({
        side: THREE.DoubleSide,
        uniforms: { uBase: { value: new THREE.Color(base) }, uPeak: { value: new THREE.Color(peak) } },
        vertexShader: `attribute float aShade; varying float vShade; void main() { vShade = aShade; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
        fragmentShader: `
          uniform vec3 uBase, uPeak; varying float vShade;
          void main() {
            gl_FragColor = vec4(mix(uBase, uPeak, vShade * vShade), 1.0);
            #include <tonemapping_fragment>
            #include <colorspace_fragment>
          }`,
      });
      scene.add(new THREE.Mesh(mountainRing(470, 30, 78, 23), mountainMaterial(...T.mountains.far)));
      scene.add(new THREE.Mesh(mountainRing(430, 14, 42, 11), mountainMaterial(...T.mountains.near)));

      // Sunset: the glass towers reflect this sky (an environment map rendered from the dome and the sun)
      if (T.environment > 0) {
        const envScene = new THREE.Scene();
        envScene.add(new THREE.Mesh(dome.geometry, dome.material));
        const sunCopy = new THREE.Mesh(moon.geometry, moon.material);
        sunCopy.position.copy(moon.position);
        sunCopy.quaternion.copy(moon.quaternion);
        sunCopy.scale.copy(moon.scale);
        envScene.add(sunCopy);
        const pmrem = new THREE.PMREMGenerator(renderer);
        scene.environment = pmrem.fromScene(envScene, 0.02, 0.1, 1000).texture;
        scene.environmentIntensity = T.environment;
        pmrem.dispose();
      }

      // The sky moves with the camera so it always sits "at infinity"
      tick((t) => {
        sky.position.copy(camera.position);
        skyTime.value = t;
      });
    }

    /** Star field beyond the mountains (same look as drei's <Stars>). */
    function addStars({ scene, quality }) {
      const count = quality === "high" ? 4000 : 1500;
      const radius = 520;
      const depth = 60;
      const factor = 5;
      const positions = [];
      const colors = [];
      const sizes = [];
      const color = new THREE.Color();
      let r = radius + depth;
      const increment = depth / count;
      for (let i = 0; i < count; i++) {
        r -= increment * Math.random();
        const v = new THREE.Vector3().setFromSpherical(new THREE.Spherical(r, Math.acos(1 - Math.random() * 2), Math.random() * 2 * Math.PI));
        positions.push(v.x, v.y, v.z);
        color.setHSL(i / count, 0, 0.9);
        colors.push(color.r, color.g, color.b);
        sizes.push((0.5 + 0.5 * Math.random()) * factor);
      }
      const geo = new THREE.BufferGeometry();
      geo.setAttribute("position", new THREE.Float32BufferAttribute(positions, 3));
      geo.setAttribute("color", new THREE.Float32BufferAttribute(colors, 3));
      geo.setAttribute("size", new THREE.Float32BufferAttribute(sizes, 1));
      const material = new THREE.ShaderMaterial({
        uniforms: { time: { value: 0 }, fade: { value: 1 } },
        vertexShader: `
          uniform float time; attribute float size; varying vec3 vColor;
          void main() {
            vColor = color;
            vec4 mvPosition = modelViewMatrix * vec4(position, 0.5);
            gl_PointSize = size * (30.0 / -mvPosition.z) * (3.0 + sin(time + 100.0));
            gl_Position = projectionMatrix * mvPosition;
          }`,
        fragmentShader: `
          uniform float fade; varying vec3 vColor;
          void main() {
            float d = distance(gl_PointCoord, vec2(0.5));
            float opacity = 1.0 / (1.0 + exp(16.0 * (d - 0.25)));
            gl_FragColor = vec4(vColor, opacity);
            #include <tonemapping_fragment>
            #include <colorspace_fragment>
          }`,
        blending: THREE.AdditiveBlending,
        depthWrite: false,
        transparent: true,
        vertexColors: true,
      });
      scene.add(new THREE.Points(geo, material));
      tick((t) => (material.uniforms.time.value = t * 0.6));
    }

    /* ---------- Ground, roads and street lights ---------- */

    function addGround({ scene }) {
      const dummy = new THREE.Object3D();
      // Ground and roads pick up less of the pink sky, so they stay cream
      const ground = mesh(new THREE.PlaneGeometry(900, 900), standard(T.ground, { roughness: 1, envMapIntensity: 0.35 }), [0, 0, 0], [-Math.PI / 2, 0, 0]);
      ground.userData.ground = true;
      scene.add(ground);

      const roadLength = CITY_HALF * 2 + ROAD_WIDTH;
      const roadCount = ROADS.length * 2;
      const roads = new THREE.InstancedMesh(new THREE.PlaneGeometry(), standard(T.road, { roughness: 0.9, envMapIntensity: 0.35 }), roadCount);
      roads.userData.ground = true;
      const lineColor = new THREE.Color(T.roadLine.color).multiplyScalar(T.roadLine.strength);
      const lines = new THREE.InstancedMesh(new THREE.PlaneGeometry(), basic(lineColor, { transparent: true, opacity: T.roadLine.opacity }), roadCount);
      let i = 0;
      for (const c of ROADS) {
        for (const axis of ["x", "z"]) {
          dummy.position.set(axis === "x" ? 0 : c, 0.02, axis === "x" ? c : 0);
          dummy.rotation.set(-Math.PI / 2, 0, axis === "x" ? 0 : Math.PI / 2);
          dummy.scale.set(roadLength, ROAD_WIDTH, 1);
          dummy.updateMatrix();
          roads.setMatrixAt(i, dummy.matrix);
          dummy.scale.set(roadLength, 0.12, 1);
          dummy.position.y = 0.04;
          dummy.updateMatrix();
          lines.setMatrixAt(i, dummy.matrix);
          i++;
        }
      }
      scene.add(roads, lines);

      const crossings = ROADS.flatMap((x) => ROADS.map((z) => [x, z]));
      const poles = new THREE.InstancedMesh(new THREE.CylinderGeometry(0.08, 0.1, 3.4, 5), standard("#334155"), crossings.length);
      const lamps = new THREE.InstancedMesh(new THREE.SphereGeometry(0.28, 8, 8), basic(glow(AMBER, T.lamp)), crossings.length);
      dummy.rotation.set(0, 0, 0);
      dummy.scale.set(1, 1, 1);
      crossings.forEach(([x, z], j) => {
        dummy.position.set(x + 2, 3.4, z + 2);
        dummy.updateMatrix();
        lamps.setMatrixAt(j, dummy.matrix);
        dummy.position.set(x + 2, 1.7, z + 2);
        dummy.updateMatrix();
        poles.setMatrixAt(j, dummy.matrix);
      });
      scene.add(poles, lamps);
    }

    /* ---------- The coast: on one side the desert turns into a beach and the sea ---------- */

    /** Direction from the city centre toward the sea: the same way as the sun, so it sets over the water. */
    const SEA_DIR = new THREE.Vector2(-0.36, -0.93).normalize();
    const WATER_LEVEL = 0.45;

    /** 1 inside the sea's angular sector, 0 outside, with a soft edge. */
    function seaSector(x, z) {
      const r = Math.hypot(x, z) || 1;
      return THREE.MathUtils.smoothstep((x * SEA_DIR.x + z * SEA_DIR.y) / r, 0.74, 0.9);
    }

    /** How much a point is beach (flat sand) and how much it is sea floor. */
    function coastAt(x, z) {
      const r = Math.hypot(x, z);
      const sector = seaSector(x, z);
      return { beach: sector * THREE.MathUtils.smoothstep(r, 160, 205), sea: sector * THREE.MathUtils.smoothstep(r, 212, 252) };
    }

    /** A point at a distance along the sea direction, turned sideways by `side` units. */
    const alongCoast = (distance, side = 0) => [SEA_DIR.x * distance - SEA_DIR.y * side, SEA_DIR.y * distance + SEA_DIR.x * side];

    /* ---------- Desert between the city and the mountains ---------- */

    function desertNoise(x, z) {
      const hash = (a, b) => {
        const v = Math.sin(a * 127.1 + b * 311.7) * 43758.5453;
        return v - Math.floor(v);
      };
      const ix = Math.floor(x);
      const iz = Math.floor(z);
      const fx = x - ix;
      const fz = z - iz;
      const u = fx * fx * (3 - 2 * fx);
      const v = fz * fz * (3 - 2 * fz);
      const a = hash(ix, iz);
      const b = hash(ix + 1, iz);
      const c = hash(ix, iz + 1);
      const d = hash(ix + 1, iz + 1);
      return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
    }

    function desertFbm(x, z) {
      let sum = 0;
      let amp = 0.5;
      for (let i = 0; i < 4; i++) {
        sum += amp * desertNoise(x, z);
        x *= 2.03;
        z *= 2.03;
        amp *= 0.5;
      }
      return sum;
    }

    /** Wind-shaped dunes, flat (m = 0) inside the city and along the Experience Highway. */
    function duneAt(x, z) {
      const smooth = (a, b, v) => THREE.MathUtils.smoothstep(v, a, b);
      let m = smooth(128, 178, Math.hypot(x, z));
      if (Math.abs(x) < 178) m *= Math.max(smooth(9, 26, Math.abs(z - HIGHWAY_Z)), smooth(152, 178, Math.abs(x)));
      if (m <= 0) return { h: 0, m, crest: 0 };
      const warp = desertFbm(x * 0.012 + 7, z * 0.012);
      const ridge = 1 - Math.abs(Math.sin(x * 0.03 + z * 0.012 + warp * 4));
      const crest = ridge * ridge;
      return { h: m * (crest * 8 + warp * 7 + desertFbm(x * 0.004, z * 0.004) * 10), m, crest };
    }

    /** Dunes that blend out of the city ground, flat-topped mesas, and scattered cacti, rocks and shrubs. */
    function addDesert({ scene, quality }) {
      const high = quality === "high";
      const terrain = new THREE.PlaneGeometry(900, 900, 256, 256).rotateX(-Math.PI / 2);
      const pos = terrain.attributes.position;
      const colors = new Float32Array(pos.count * 3);
      const base = new THREE.Color(T.ground);
      const sand = new THREE.Color(T.desert.sand);
      const crestColor = new THREE.Color(T.desert.crest);
      const beachColor = new THREE.Color(T.desert.beach);
      const wetColor = new THREE.Color(T.desert.wet);
      const c = new THREE.Color();
      for (let i = 0; i < pos.count; i++) {
        const { h, m, crest } = duneAt(pos.getX(i), pos.getZ(i));
        const { beach, sea } = coastAt(pos.getX(i), pos.getZ(i));
        // Flat parts sink just under the city ground, so the two never flicker against each other.
        // Toward the sea the dunes flatten into a beach just above the water, then slope under it.
        let y = h - 0.08 * (1 - m);
        y = THREE.MathUtils.lerp(y, WATER_LEVEL + 0.5, beach);
        y = THREE.MathUtils.lerp(y, -4, sea);
        pos.setY(i, y);
        c.copy(base).lerp(sand, m).lerp(crestColor, m * crest * 0.6 * (1 - beach)).lerp(beachColor, beach).lerp(wetColor, THREE.MathUtils.smoothstep(sea, 0, 0.3));
        c.toArray(colors, i * 3);
      }
      terrain.setAttribute("color", new THREE.BufferAttribute(colors, 3));
      terrain.computeVertexNormals();
      const dunes = new THREE.Mesh(terrain, standard(0xffffff, { vertexColors: true, roughness: 1, envMapIntensity: 0.35 }));
      dunes.userData.ground = true;
      scene.add(dunes);

      const scatter = (count, seed, min, max) => {
        const rand = seeded(seed);
        const spots = [];
        for (let tries = 0; spots.length < count && tries < count * 20; tries++) {
          const a = rand() * Math.PI * 2;
          const d = min + rand() * (max - min);
          const x = Math.cos(a) * d;
          const z = Math.sin(a) * d;
          const { h, m } = duneAt(x, z);
          // Desert only: nothing on the beach or in the sea
          if (m < 0.95 || coastAt(x, z).beach > 0.02) continue;
          spots.push({ x, z, y: h, s: rand(), r: rand() * Math.PI * 2 });
        }
        return spots;
      };
      const o = new THREE.Object3D();
      const instanced = (geometry, color, spots, place, flatShading = false) => {
        const im = new THREE.InstancedMesh(geometry, standard(color, { roughness: 0.95, flatShading, envMapIntensity: 0.4 }), spots.length);
        spots.forEach((spot, i) => {
          o.position.set(spot.x, spot.y, spot.z);
          o.rotation.set(0, spot.r, 0);
          o.scale.setScalar(1);
          place(spot, o);
          o.updateMatrix();
          im.setMatrixAt(i, o.matrix);
        });
        im.frustumCulled = false;
        scene.add(im);
      };

      const part = (r, h, x, y, z = 0) => new THREE.CylinderGeometry(r, r * 1.1, h, 7).translate(x, y, z);
      const tip = (r, x, y) => new THREE.SphereGeometry(r, 7, 5).translate(x, y, 0);
      const cactus = mergeGeometries([
        part(0.38, 5, 0, 2.5),
        tip(0.38, 0, 5),
        part(0.24, 1.1, 0.75, 2.2).rotateZ(Math.PI / 2).translate(2.2, 1.4, 0),
        part(0.24, 1.8, 1.2, 3.1),
        tip(0.24, 1.2, 4),
        part(0.22, 0.9, -0.65, 2.9).rotateZ(Math.PI / 2).translate(-2.9, 2.2, 0),
        part(0.22, 1.4, -1.05, 3.6),
        tip(0.22, -1.05, 4.3),
      ]);
      // Two tiers: a wide eroded base and a narrower cap
      const mesa = mergeGeometries([
        new THREE.CylinderGeometry(0.9, 1.12, 0.62, 8, 1).translate(0, 0.31, 0),
        new THREE.CylinderGeometry(0.58, 0.72, 0.4, 7, 1).translate(0.12, 0.8, -0.08),
      ]);

      instanced(mesa, T.desert.mesa, scatter(9, 71, 250, 350), (sp, ob) => {
        ob.scale.set(12 + sp.s * 12, 20 + sp.r * 4, 10 + sp.s * 10);
        ob.position.y -= 2;
      }, true);
      instanced(cactus, T.desert.cactus, scatter(high ? 140 : 60, 31, 185, 420), (sp, ob) => ob.scale.setScalar(0.9 + sp.s * 0.8));
      instanced(new THREE.DodecahedronGeometry(1, 0), T.desert.rock, scatter(high ? 220 : 90, 47, 180, 425), (sp, ob) => {
        ob.scale.set(1 + sp.s * 2.4, 0.6 + sp.s * 1.4, 1 + sp.r * 0.4);
        ob.position.y -= 0.3;
      }, true);
      instanced(new THREE.IcosahedronGeometry(1, 0).translate(0, 0.6, 0), T.desert.shrub, scatter(high ? 320 : 120, 53, 180, 425), (sp, ob) =>
        ob.scale.set(0.8 + sp.s, 0.45 + sp.s * 0.3, 0.8 + sp.s), true);
    }

    /* ---------- Beach and sea ---------- */

    /** Shared clock for the waves, updated every frame. */
    const waterTime = { value: 0 };

    /**
     * The coast past the edge of the desert: animated sea, a palm-lined beach with
     * umbrellas, a wooden pier, sailboats bobbing offshore, and a lighthouse whose
     * beam sweeps across the water at night.
     */
    function addBeach({ scene, quality }) {
      const night = T.celestial.kind === "moon";
      const beachY = (x, z) => THREE.MathUtils.lerp(0, WATER_LEVEL + 0.5, coastAt(x, z).beach);
      const UP = new THREE.Vector3(0, 1, 0);
      const matrix = (x, y, z, rotY = 0, scale = 1) =>
        new THREE.Matrix4().compose(new THREE.Vector3(x, y, z), new THREE.Quaternion().setFromAxisAngle(UP, rotY), new THREE.Vector3(scale, scale, scale));
      const copies = (geometry, color, matrices, flatShading = false) => {
        const im = new THREE.InstancedMesh(geometry, standard(color, { roughness: 0.85, flatShading, side: THREE.DoubleSide, envMapIntensity: 0.5 }), matrices.length);
        matrices.forEach((m, i) => im.setMatrixAt(i, m));
        im.frustumCulled = false;
        scene.add(im);
      };

      // Sea water: waves, fresnel sky reflection, a glitter path toward the sun or moon, and foam on the shore.
      // Drawn only inside the sea's sector, so it never covers the city or the desert.
      const water = new THREE.ShaderMaterial({
        fog: true,
        uniforms: THREE.UniformsUtils.merge([
          THREE.UniformsLib.fog,
          {
            uSeaDir: { value: SEA_DIR.clone() },
            uDeep: { value: new THREE.Color(T.sea.deep) },
            uShallow: { value: new THREE.Color(T.sea.shallow) },
            uSky: { value: new THREE.Color(T.sea.sky) },
            uGlitter: { value: new THREE.Color(T.sea.glitter) },
            uFoam: { value: T.sea.foam },
            uSunDir: { value: new THREE.Vector3(...T.celestial.dir).setY(Math.max(T.celestial.dir[1], 0.06)).normalize() },
          },
        ]),
        vertexShader: `
          #include <fog_pars_vertex>
          varying vec3 vWorld;
          void main() {
            vec4 world = modelMatrix * vec4(position, 1.0);
            vWorld = world.xyz;
            vec4 mvPosition = viewMatrix * world;
            gl_Position = projectionMatrix * mvPosition;
            #include <fog_vertex>
          }`,
        fragmentShader: `
          #include <fog_pars_fragment>
          uniform float uTime, uFoam;
          uniform vec2 uSeaDir;
          uniform vec3 uDeep, uShallow, uSky, uGlitter, uSunDir;
          varying vec3 vWorld;
          void main() {
            vec2 p = vWorld.xz;
            float r = length(p);
            float sector = smoothstep(0.74, 0.9, dot(p, uSeaDir) / max(r, 1.0));
            if (sector * smoothstep(188.0, 206.0, r) < 0.01) discard;
            float sea = sector * smoothstep(212.0, 252.0, r);
            vec2 d1 = normalize(vec2(0.6, 0.8));
            vec2 d2 = normalize(vec2(-0.4, 1.0));
            vec2 d3 = normalize(vec2(1.0, 0.25));
            vec2 slope = d1 * cos(dot(d1, p) * 0.35 + uTime * 1.1) * 0.05
                       + d2 * cos(dot(d2, p) * 0.7 + uTime * 1.7) * 0.04
                       + d3 * cos(dot(d3, p) * 1.6 + uTime * 2.4) * 0.03;
            vec3 n = normalize(vec3(-slope.x, 1.0, -slope.y));
            vec3 v = normalize(cameraPosition - vWorld);
            float fresnel = pow(1.0 - max(dot(n, v), 0.0), 4.0);
            vec3 col = mix(uShallow, uDeep, smoothstep(0.25, 0.9, sea));
            col = mix(col, uSky, 0.15 + 0.7 * fresnel);
            vec3 refl = reflect(-v, n);
            float sun = max(dot(refl, uSunDir), 0.0);
            col += uGlitter * (pow(sun, 160.0) * 3.0 + pow(sun, 14.0) * 0.25);
            float shore = 1.0 - smoothstep(0.03, 0.3, sea);
            float bands = 0.5 + 0.5 * sin(shore * 22.0 - uTime * 1.6 + sin(dot(p, d3) * 0.08) * 2.0);
            col = mix(col, vec3(1.0), shore * smoothstep(0.55, 1.0, bands) * uFoam);
            gl_FragColor = vec4(col, 1.0);
            #include <tonemapping_fragment>
            #include <colorspace_fragment>
            #include <fog_fragment>
          }`,
      });
      // merge() copies uniforms, so attach the shared clock afterwards
      water.uniforms.uTime = waterTime;
      const sea = mesh(new THREE.PlaneGeometry(1800, 1800), water, [0, WATER_LEVEL, 0], [-Math.PI / 2, 0, 0]);
      sea.renderOrder = 1;
      scene.add(sea);

      // Palm trees: a gently curved trunk and a crown of drooping fronds
      const rand = seeded(91);
      const trunk = mergeGeometries(Array.from({ length: 6 }, (_, i) =>
        new THREE.CylinderGeometry(0.22 - i * 0.02, 0.26 - i * 0.02, 1.4, 6).translate(0, 0.7, 0).rotateZ(-0.06 * i).translate(i * i * 0.05, i * 1.32, 0)));
      const fronds = mergeGeometries(Array.from({ length: 7 }, (_, i) =>
        new THREE.ConeGeometry(0.45, 3.4, 4, 1).rotateZ(Math.PI / 2 + 0.5).translate(1.5, -0.4, 0).rotateY((i / 7) * Math.PI * 2).translate(1.25, 8.1, 0)));
      const palms = [];
      for (let i = 0; i < (quality === "high" ? 34 : 16); i++) {
        const [x, z] = alongCoast(172 + rand() * 32, (rand() - 0.5) * 170);
        if (coastAt(x, z).sea > 0.02) continue;
        palms.push(matrix(x, beachY(x, z), z, rand() * Math.PI * 2, 0.9 + rand() * 0.5));
      }
      copies(trunk, "#8a6a4a", palms);
      copies(fronds, night ? "#183026" : "#3f7a3a", palms, true);

      // Beach umbrellas
      const umbrellaColors = ["#e85d4a", "#f2c14e", "#2dd4bf", "#f8fafc", "#7c6cf0"];
      for (let i = 0; i < 12; i++) {
        const [x, z] = alongCoast(196 + rand() * 9, -70 + i * 12 + rand() * 4);
        const u = new THREE.Group();
        u.position.set(x, beachY(x, z), z);
        u.rotation.y = rand() * Math.PI;
        u.add(mesh(new THREE.CylinderGeometry(0.05, 0.05, 2.8, 5), standard("#e2e8f0"), [0, 1.4, 0]));
        u.add(mesh(new THREE.ConeGeometry(1.6, 0.7, 8), standard(umbrellaColors[i % umbrellaColors.length], { roughness: 0.8 }), [0, 2.8, 0]));
        scene.add(u);
      }

      // Pier: a boardwalk from the beach out over the water, on posts
      const [sx, sz] = alongCoast(203, 26);
      const [ex, ez] = alongCoast(262, 26);
      const angle = Math.atan2(-(ez - sz), ex - sx);
      scene.add(mesh(new THREE.BoxGeometry(Math.hypot(ex - sx, ez - sz), 0.3, 3), standard("#8b6b4e", { roughness: 0.9 }), [(sx + ex) / 2, WATER_LEVEL + 1.1, (sz + ez) / 2], [0, angle, 0]));
      copies(new THREE.CylinderGeometry(0.18, 0.18, 3, 6).translate(0, 0.5, 0), "#5b4636",
        Array.from({ length: 9 }, (_, i) => matrix(sx + ((ex - sx) * i) / 8, -0.6, sz + ((ez - sz) * i) / 8, angle)));

      // Sailboats bobbing offshore
      const sail = new THREE.BufferGeometry();
      sail.setAttribute("position", new THREE.Float32BufferAttribute([0, 0.8, 0.05, 0, 6.2, 0.05, 2.6, 0.8, 0.05, 0, 0.8, -0.05, 2.6, 0.8, -0.05, 0, 6.2, -0.05], 3));
      sail.computeVertexNormals();
      const hull = mergeGeometries([
        new THREE.BoxGeometry(5, 0.9, 1.6).translate(0, 0.2, 0),
        new THREE.ConeGeometry(0.8, 1.6, 4).rotateZ(-Math.PI / 2).rotateX(Math.PI / 4).translate(3.3, 0.2, 0),
      ]);
      const boats = Array.from({ length: 4 }, (_, i) => {
        const [x, z] = alongCoast(275 + i * 38 + rand() * 20, (rand() - 0.5) * 140);
        const b = new THREE.Group();
        b.position.set(x, WATER_LEVEL, z);
        b.rotation.y = rand() * Math.PI * 2;
        b.add(mesh(hull, standard("#f1f5f9", { roughness: 0.6 })));
        b.add(mesh(new THREE.CylinderGeometry(0.07, 0.07, 6.6, 5), standard("#475569"), [0, 3.6, 0]));
        b.add(mesh(sail, standard(night ? "#94a3b8" : "#fff7ed", { side: THREE.DoubleSide, roughness: 0.9 })));
        scene.add(b);
        return { b, phase: rand() * 6 };
      });

      // Lighthouse on the point, with a beam that sweeps the sea at night
      const [lx, lz] = alongCoast(201, 84);
      const lighthouse = new THREE.Group();
      lighthouse.position.set(lx, beachY(lx, lz), lz);
      lighthouse.add(mesh(new THREE.CylinderGeometry(1.3, 2, 14, 16), standard("#f8fafc", { roughness: 0.7 }), [0, 7, 0]));
      for (const y of [3, 8]) lighthouse.add(mesh(new THREE.CylinderGeometry(1.9 - y * 0.055, 1.95 - y * 0.055, 1.6, 16), standard("#dc2626", { roughness: 0.7 }), [0, y, 0]));
      lighthouse.add(mesh(new THREE.CylinderGeometry(1, 1, 2, 12), basic(glow("#FFE9A8", night ? 4 : 2)), [0, 15, 0]));
      lighthouse.add(mesh(new THREE.ConeGeometry(1.5, 1.4, 12), standard("#1e293b"), [0, 16.6, 0]));
      const beam = new THREE.Group();
      beam.position.y = 15;
      if (night) {
        beam.add(mesh(new THREE.ConeGeometry(4, 44, 16, 1, true),
          basic(glow("#FFF1C2", 1.6), { transparent: true, opacity: 0.16, depthWrite: false, blending: THREE.AdditiveBlending, side: THREE.DoubleSide }),
          [22, 0, 0], [0, 0, Math.PI / 2]));
      }
      lighthouse.add(beam);
      scene.add(lighthouse);

      tick((t) => {
        waterTime.value = t;
        for (const { b, phase } of boats) {
          b.position.y = WATER_LEVEL + Math.sin(t * 1.2 + phase) * 0.18;
          b.rotation.z = Math.sin(t * 0.9 + phase) * 0.05;
        }
        beam.rotation.y = t * 0.8;
      });
    }

    /* ---------- Filler buildings ---------- */

    function addBuildings({ scene, quality }) {
      const rand = seeded(7);
      const lots = [];
      const perSide = quality === "high" ? 2 : 1;
      const usable = BLOCK - 4;
      const cell = usable / perSide;
      for (let bx = -BLOCK_RANGE; bx <= BLOCK_RANGE; bx++) {
        for (let bz = -BLOCK_RANGE; bz <= BLOCK_RANGE; bz++) {
          const cx = bx * BLOCK;
          const cz = bz * BLOCK;
          if (RESERVED.has(`${cx},${cz}`)) continue;
          const nearTower = Math.abs(bx) <= 1 && Math.abs(bz) <= 1;
          for (let i = 0; i < perSide; i++) {
            for (let j = 0; j < perSide; j++) {
              if (rand() < 0.12) continue;
              const dist = Math.hypot(cx, cz);
              const base = Math.max(4, 34 - dist * 0.26);
              let h = base * (0.45 + rand() * 0.9);
              if (rand() < 0.06) h *= 1.6;
              if (nearTower) h = Math.min(h, 26);
              const w = cell * (0.62 + rand() * 0.3);
              const d = cell * (0.62 + rand() * 0.3);
              lots.push({ x: cx - usable / 2 + cell * (i + 0.5), z: cz - usable / 2 + cell * (j + 0.5), w, d, h });
            }
          }
        }
      }
      const tall = lots.filter((l) => l.h > 26);
      const dummy = new THREE.Object3D();
      const blocks = new THREE.InstancedMesh(new THREE.BoxGeometry(), createWindowMaterial(T.building), lots.length);
      lots.forEach((l, i) => {
        dummy.position.set(l.x, l.h / 2, l.z);
        dummy.scale.set(l.w, l.h, l.d);
        dummy.updateMatrix();
        blocks.setMatrixAt(i, dummy.matrix);
      });
      const beaconMat = basic(glow(AMBER, 3), { transparent: true });
      const beacons = new THREE.InstancedMesh(new THREE.SphereGeometry(0.35, 8, 8), beaconMat, Math.max(tall.length, 1));
      dummy.scale.set(1, 1, 1);
      tall.forEach((l, i) => {
        dummy.position.set(l.x, l.h + 0.6, l.z);
        dummy.updateMatrix();
        beacons.setMatrixAt(i, dummy.matrix);
      });
      scene.add(blocks, beacons);
      tick((t) => (beaconMat.opacity = 0.35 + 0.65 * Math.max(0, Math.sin(t * 2))));
    }

    /* ---------- Traffic ---------- */

    function addTraffic({ scene, quality }) {
      const count = quality === "high" ? 220 : 70;
      const HIGHWAY_HALF = 150;
      const PAINTS = ["#E2E8F0", "#94A3B8", "#1E3A5F", "#7F1D1D", "#111827", "#334155", "#0F766E"];
      const rand = seeded(42);
      const cars = [];
      for (let i = 0; i < count; i++) {
        const dir = rand() < 0.5 ? 1 : -1;
        if (i % 5 === 0) {
          const lanes = dir === 1 ? [1.3, 2.9] : [-1.3, -2.9];
          cars.push({ axis: "x", lane: HIGHWAY_Z + lanes[Math.floor(rand() * 2)], dir, offset: rand() * HIGHWAY_HALF * 2, speed: 22 + rand() * 14, min: -HIGHWAY_HALF, max: HIGHWAY_HALF });
          continue;
        }
        const road = ROADS[Math.floor(rand() * ROADS.length)];
        cars.push({ axis: rand() < 0.5 ? "x" : "z", lane: road + dir * 0.75, dir, offset: rand() * CITY_HALF * 2, speed: 7 + rand() * 9, min: -CITY_HALF, max: CITY_HALF });
      }

      const parts = (boxes) => mergeGeometries(boxes.map(([w, h, d, x, y, z]) => new THREE.BoxGeometry(w, h, d).translate(x, y, z)));
      const wheel = (x, z) => new THREE.CylinderGeometry(0.2, 0.2, 0.16, 10).rotateX(Math.PI / 2).translate(x, 0.2, z);
      const geo = {
        body: parts([[2.4, 0.4, 1.0, 0, 0.42, 0], [0.5, 0.12, 0.96, 0.95, 0.66, 0]]),
        cabin: parts([[1.2, 0.36, 0.86, -0.2, 0.8, 0]]),
        wheels: mergeGeometries([wheel(0.8, 0.46), wheel(0.8, -0.46), wheel(-0.8, 0.46), wheel(-0.8, -0.46)]),
        head: parts([[0.04, 0.1, 0.2, 1.21, 0.48, 0.32], [0.04, 0.1, 0.2, 1.21, 0.48, -0.32]]),
        tail: parts([[0.04, 0.1, 0.24, -1.21, 0.5, 0.3], [0.04, 0.1, 0.24, -1.21, 0.5, -0.3]]),
        strip: parts([[2.0, 0.05, 1.02, 0, 0.3, 0]]),
      };
      const body = new THREE.InstancedMesh(geo.body, standard(0xffffff, { metalness: 0.6, roughness: 0.35 }), count);
      const cabin = new THREE.InstancedMesh(geo.cabin, standard("#0B1220", { metalness: 0.9, roughness: 0.1, emissive: "#1E293B" }), count);
      const wheels = new THREE.InstancedMesh(geo.wheels, standard("#0A0A0A", { roughness: 0.9 }), count);
      const head = new THREE.InstancedMesh(geo.head, basic(glow("#FFF7D6", 3)), count);
      const tail = new THREE.InstancedMesh(geo.tail, basic(glow("#EF4444", 2.6)), count);
      const strip = new THREE.InstancedMesh(geo.strip, basic(0xffffff), count);
      const teal = glow(BRAND_GLOW, 2.2);
      const amber = glow(AMBER, 2.2);
      const paint = new THREE.Color();
      cars.forEach((c, i) => {
        strip.setColorAt(i, c.dir === 1 ? teal : amber);
        body.setColorAt(i, paint.set(PAINTS[i % PAINTS.length]));
      });
      // Neon underglow only in the night city
      const meshes = T.carStrip ? [body, cabin, wheels, head, tail, strip] : [body, cabin, wheels, head, tail];
      scene.add(...meshes);
      const dummy = new THREE.Object3D();
      tick((_, delta) => {
        const dt = Math.min(delta, 0.05);
        cars.forEach((c, i) => {
          const span = c.max - c.min;
          c.offset = (c.offset + c.speed * dt) % span;
          const along = c.dir === 1 ? c.min + c.offset : c.max - c.offset;
          if (c.axis === "x") {
            dummy.position.set(along, 0, c.lane);
            dummy.rotation.set(0, c.dir === 1 ? 0 : Math.PI, 0);
          } else {
            dummy.position.set(c.lane, 0, along);
            dummy.rotation.set(0, c.dir === 1 ? -Math.PI / 2 : Math.PI / 2, 0);
          }
          dummy.updateMatrix();
          for (const m of meshes) m.setMatrixAt(i, dummy.matrix);
        });
        for (const m of meshes) m.instanceMatrix.needsUpdate = true;
      });
    }

    const projectSites = [];

    function addLandmarks({ scene, camera, signal }) {
      const models = {
        implementation: { height: 37, build: bank },
        manufacturing: { height: 7, build: mall },
        analysis: { height: 29, build: glassOffice },
        assets: { height: 14, build: clinic },
        supplychain: { height: 15, build: port },
      };
      const labels = document.getElementById("city-labels");
      for (const project of PROJECTS) {
        const { height, build } = models[project.district];
        const [x, z] = LANDMARKS[project.district];
        const site = new THREE.Group();
        site.position.set(x, 0, z);
        const hit = new THREE.Group();
        hit.userData.slug = project.slug;
        build(hit, project);
        const beacon = liveBeacon(height);
        site.add(hit, beacon.group);
        scene.add(site);

        const label = document.createElement("div");
        label.className = "city-label-anchor";
        label.innerHTML = `<div class="city-label" style="translate:-50% -50%"><span class="city-label__live">● ${DISTRICTS[project.district].label}</span><strong>${esc(project.name)}</strong><span>${esc(project.role)}</span></div>`;
        label.hidden = true;
        labels.append(label);
        projectSites.push({ project, hit, beacon, label, anchor: new THREE.Vector3(x, height + 3, z) });
      }

      const v = new THREE.Vector3();
      tick((t) => {
        const inProjects = state.activeSection === "projects";
        for (const s of projectSites) {
          const active = state.filter === "all" || state.filter === s.project.district;
          const hovered = state.hovered === s.project.slug;
          s.beacon.update(t, active, hovered);
          const visible = hovered || (inProjects && active);
          v.copy(s.anchor).project(camera);
          const onScreen = v.z < 1 && Math.abs(v.x) < 1.2 && Math.abs(v.y) < 1.2;
          s.label.hidden = !(visible && onScreen);
          if (!s.label.hidden) {
            s.label.style.transform = `translate(${(v.x * 0.5 + 0.5) * window.innerWidth}px, ${(-v.y * 0.5 + 0.5) * window.innerHeight}px)`;
            s.label.firstElementChild.classList.toggle("is-hovered", hovered);
          }
        }
      });

      // Hover and click the buildings. Page panels sit above the canvas, so listen on the window.
      const raycaster = new THREE.Raycaster();
      const pointer = new THREE.Vector2();
      const pick = (e) => {
        if (state.simple || state.openProject || e.target.closest?.(".panel, a, button, header, input, label, nav, summary, #minimap")) return null;
        pointer.set((e.clientX / window.innerWidth) * 2 - 1, -(e.clientY / window.innerHeight) * 2 + 1);
        raycaster.setFromCamera(pointer, camera);
        const hit = raycaster.intersectObjects(projectSites.map((s) => s.hit), true)[0];
        let o = hit?.object;
        while (o && !o.userData.slug) o = o.parent;
        return o?.userData.slug ?? null;
      };
      let over = null;
      window.addEventListener("pointermove", (e) => {
        if (e.pointerType !== "mouse") return;
        const slug = pick(e);
        if (slug === over) return;
        over = slug;
        setState({ hovered: slug });
        if (slug) document.body.dataset.cursor = "hover";
        else delete document.body.dataset.cursor;
      }, { signal });
      window.addEventListener("click", (e) => {
        const slug = pick(e);
        if (!slug) return;
        delete document.body.dataset.cursor;
        openProject(slug);
      }, { signal });
    }
