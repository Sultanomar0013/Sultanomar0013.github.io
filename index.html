        let line = "";
        for (const word of text.split(" ")) {
          if ((line + " " + word).trim().length > max) {
            lines.push(line);
            line = word;
          } else line = (line + " " + word).trim();
        }
        if (line) lines.push(line);
        return lines;
      };
      PRINCIPLES.forEach((p, i) => {
        const angle = -0.9 + i * 0.9;
        const bx = Math.sin(angle) * 7;
        const bz = -Math.cos(angle) * 7;
        const facing = Math.atan2(cam[0] - (x + bx), cam[2] - (z + bz));
        const b = new THREE.Group();
        b.position.set(bx, 0, bz);
        b.add(mesh(new THREE.CylinderGeometry(0.15, 0.15, 5, 8), standard("#475569"), [0, 2.5, 0]));
        b.add(sign({ eyebrow: `Principle ${i + 1}`, title: p.label, lines: wrap(`“${p.text}”`, 34).slice(0, 3), width: 7, aspect: 1.6, position: [0, 7.4, 0], rotation: [0, facing, 0] }));
        g.add(b);
      });
      scene.add(g);
      tick((t) => (fountain.scale.y = 1 + Math.sin(t * 2.4) * 0.25));
    }

    function addParks({ scene }) {
      const rand = seeded(11);
      const trunk = standard("#5B4636");
      const leaves = standard("#2F855A", { flatShading: true });
      for (const [x, z] of PARKS) {
        const g = new THREE.Group();
        g.position.set(x, 0, z);
        g.add(mesh(new THREE.BoxGeometry(12.5, 0.2, 12.5), standard("#1F4D3A", { roughness: 1 }), [0, 0.1, 0]));
        for (let i = 0; i < 9; i++) {
          const tree = new THREE.Group();
          tree.position.set((rand() - 0.5) * 10, 0, (rand() - 0.5) * 10);
          tree.scale.setScalar(0.8 + rand() * 0.6);
          tree.add(mesh(new THREE.CylinderGeometry(0.12, 0.16, 1.2, 6), trunk, [0, 0.6, 0]));
          tree.add(mesh(new THREE.ConeGeometry(0.9, 2.2, 7), leaves, [0, 2, 0]));
          g.add(tree);
        }
        scene.add(g);
      }
    }

    /* ---------- "Your project here": the plot where the visitor's building rises ---------- */

    function addPlot({ scene }) {
      const SIZE = 11;
      const H = 22;
      const RISE = 2.6;
      const [x, z] = PLACES.plot;
      const g = new THREE.Group();
      g.position.set(x, 0, z);
      const teal = glow(BRAND, 2.6);
      g.add(mesh(new THREE.BoxGeometry(SIZE + 2, 0.16, SIZE + 2), standard("#14532D"), [0, 0.08, 0]));
      const borderMat = basic(teal, { transparent: true });
      for (const r of [0, Math.PI / 2, Math.PI, -Math.PI / 2]) {
        g.add(mesh(new THREE.BoxGeometry(SIZE + 1.4, 0.18, 0.18), borderMat, [Math.sin(r) * (SIZE / 2 + 0.6), 0.25, Math.cos(r) * (SIZE / 2 + 0.6)], [0, r, 0]));
      }
      const board = new THREE.Group();
      board.position.set(0, 0, SIZE / 2 + 1.5);
      for (const px of [-3.4, 3.4]) board.add(mesh(new THREE.CylinderGeometry(0.14, 0.14, 4, 8), standard("#475569"), [px, 2, 0]));
      board.add(sign({ eyebrow: "Available plot", title: "YOUR PROJECT HERE", width: 8, aspect: 2.5, position: [0, 4.6, 0] }));
      g.add(board);

      const building = new THREE.Group();
      building.visible = false;
      building.add(windowBox([SIZE - 2, H, SIZE - 2], [0, H / 2, 0]));
      building.add(cornerGlow(SIZE - 2, H, SIZE - 2, H / 2));
      building.add(mesh(new THREE.BoxGeometry(SIZE - 1.6, 0.3, SIZE - 1.6), basic(teal), [0, H + 0.2, 0]));
      const nameSign = sign({ eyebrow: "Coming soon", title: "YOUR BUSINESS", width: 8, aspect: 3, position: [0, H - 3, (SIZE - 2) / 2 + 0.05] });
      building.add(nameSign);
      g.add(building);
      scene.add(g);

      let startedAt = null;
      let now = 0;
      city.onSubmitted = (submitted) => {
        board.visible = !submitted;
        if (!submitted) return;
        nameSign.userData.setText({ title: submitted.company.toUpperCase() });
        startedAt = now;
        for (let i = 0; i < 7; i++) launchFirework(x + (Math.random() - 0.5) * 24, H + 10 + Math.random() * 10, z + (Math.random() - 0.5) * 16, RISE + i * 0.3);
      };
      tick((t) => {
        now = t;
        borderMat.opacity = 0.45 + 0.4 * Math.sin(t * 3);
        if (!state.submitted || startedAt === null) {
          building.visible = false;
          return;
        }
        const k = Math.min(1, (t - startedAt) / RISE);
        building.visible = true;
        building.scale.y = Math.max(1 - Math.pow(1 - k, 3), 0.001);
      });
    }

    /* ---------- Fireworks ---------- */

    const fireworkQueue = [];
    function launchFirework(x, y, z, delay = 0) {
      fireworkQueue.push({ x, y, z, delay });
    }

    function addFireworks({ scene }) {
      const MAX = 1800;
      const PER_BURST = 150;
      const LIFE = 2.2;
      const COLORS = [BRAND, BRAND_GLOW, AMBER, "#F8FAFC"].map((c) => new THREE.Color(c).multiplyScalar(3));
      const positions = new Float32Array(MAX * 3);
      for (let i = 0; i < MAX; i++) positions[i * 3 + 1] = -999;
      const geo = new THREE.BufferGeometry();
      geo.setAttribute("position", new THREE.BufferAttribute(positions, 3));
      geo.setAttribute("color", new THREE.BufferAttribute(new Float32Array(MAX * 3), 3));
      const points = new THREE.Points(geo, new THREE.PointsMaterial({ size: 0.9, vertexColors: true, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, toneMapped: false }));
      points.frustumCulled = false;
      scene.add(points);
      const velocity = new Float32Array(MAX * 3);
      const life = new Float32Array(MAX);
      let cursor = 0;
      let pending = [];
      const dir = new THREE.Vector3();
      const pos = geo.attributes.position;
      const col = geo.attributes.color;
      tick((now, delta) => {
        const dt = Math.min(delta, 0.05);
        while (fireworkQueue.length) {
          const b = fireworkQueue.shift();
          pending.push({ ...b, at: now + b.delay });
        }
        pending = pending.filter((b) => {
          if (b.at > now) return true;
          const color = COLORS[Math.floor(Math.random() * COLORS.length)];
          for (let n = 0; n < PER_BURST; n++) {
            const i = cursor;
            cursor = (cursor + 1) % MAX;
            dir.randomDirection().multiplyScalar(6 + Math.random() * 6);
            pos.setXYZ(i, b.x, b.y, b.z);
            velocity.set([dir.x, dir.y, dir.z], i * 3);
            col.setXYZ(i, color.r, color.g, color.b);
            life[i] = LIFE;
          }
          return false;
        });
        for (let i = 0; i < MAX; i++) {
          if (life[i] <= 0) continue;
          life[i] -= dt;
          velocity[i * 3 + 1] -= 6 * dt;
          velocity[i * 3] *= 0.98;
          velocity[i * 3 + 2] *= 0.98;
          pos.setXYZ(i, pos.getX(i) + velocity[i * 3] * dt, pos.getY(i) + velocity[i * 3 + 1] * dt, pos.getZ(i) + velocity[i * 3 + 2] * dt);
          const fade = 0.97 + 0.03 * Math.max(0, life[i] / LIFE);
          col.setXYZ(i, col.getX(i) * fade, col.getY(i) * fade, col.getZ(i) * fade);
          if (life[i] <= 0) pos.setXYZ(i, 0, -999, 0);
        }
        pos.needsUpdate = true;
        col.needsUpdate = true;
      });
    }

    /* ---------- Camera: flies through the city as you scroll ---------- */

    const CAMERA_PATH = {
      home: [{ pos: [120, 62, 140], target: [0, 22, 0] }],
      intro: [{ pos: [48, 26, 72], target: [0, 18, 0] }],
      about: [{ pos: [13, 7, 15], target: [0, 18, 0] }, { pos: [18, 58, 22], target: [0, TOWER_HEIGHT - 2, 0] }],
      expertise: [{ pos: [-34, 32, -30], target: [-64, 8, -64] }],
      experience: [{ pos: [-124, 7, HIGHWAY_Z + 10], target: [-60, 5, HIGHWAY_Z] }, { pos: [64, 7, HIGHWAY_Z + 10], target: [128, 5, HIGHWAY_Z] }],
      projects: [{ pos: [0, 135, 85], target: [0, 0, 12] }],
      // Down on the beach, looking out over the sea toward the sunset
      works: [
        { pos: [-12, 18, -156], target: [-147, 3, -297] },
        { pos: [6, 11, -170], target: [-128, 2, -305] },
      ],
      process: [{ pos: [106, 22, 114], target: [80, 10, 80] }],
      testimonials: [{ pos: [-16, 26, 80], target: [-16, 2, 62] }],
      contact: [{ pos: [14, 18, 126], target: [0, 4, 96] }],
      footer: [{ pos: [150, 70, 175], target: [0, 26, 0] }],
    };

    function addCameraRig({ camera, signal }) {
      const SPAN = 0.75;
      const anchors = SECTION_IDS.flatMap((id, i) => {
        const frames = CAMERA_PATH[id];
        const held = frames.length === 1 ? [frames[0], frames[0]] : frames;
        return held.map((kf, j) => ({ at: i + (j * SPAN) / (held.length - 1), pos: new THREE.Vector3(...kf.pos), target: new THREE.Vector3(...kf.target) }));
      });
      const goalPos = new THREE.Vector3();
      const goalTarget = new THREE.Vector3();
      let lookAt = null;
      const pointer = { x: 0, y: 0 };
      window.addEventListener("pointermove", (e) => {
        pointer.x = (e.clientX / window.innerWidth) * 2 - 1;
        pointer.y = -((e.clientY / window.innerHeight) * 2 - 1);
      }, { signal });
      tick((time, delta) => {
        const p = scrollState.progress;
        let k = anchors.length - 1;
        for (let a = 0; a < anchors.length - 1; a++) {
          if (p < anchors[a + 1].at) {
            k = a;
            break;
          }
        }
        const from = anchors[k];
        const to = anchors[Math.min(k + 1, anchors.length - 1)];
        const span = to.at - from.at || 1;
        const t = THREE.MathUtils.smootherstep(THREE.MathUtils.clamp((p - from.at) / span, 0, 1), 0, 1);
        goalPos.lerpVectors(from.pos, to.pos, t);
        goalTarget.lerpVectors(from.target, to.target, t);
        goalPos.y += Math.sin(t * Math.PI) * from.pos.distanceTo(to.pos) * 0.12;
        const idle = THREE.MathUtils.clamp(1 - p, 0, 1);
        goalPos.x += Math.sin(time * 0.12) * 14 * idle;
        goalPos.z += Math.cos(time * 0.12) * 8 * idle - 8 * idle;
        goalPos.x += pointer.x * 2.5;
        goalPos.y += pointer.y * 1.5;
        if (!lookAt) {
          lookAt = goalTarget.clone();
          camera.position.copy(goalPos);
        }
        const ease = 1 - Math.exp(-Math.min(delta, 0.1) * 2.6);
        camera.position.lerp(goalPos, ease);
        lookAt.lerp(goalTarget, ease);
        camera.lookAt(lookAt);
        cameraState.x = lookAt.x;
        cameraState.z = lookAt.z;
      });
    }

    /* =====================================================================
       Start
       ===================================================================== */

    renderHeader();
    document.getElementById("main").innerHTML = [
      heroSection(),
      introSection(),
      aboutSection(),
      expertiseSection(),
      experienceSection(),
      projectsSection(),
      otherWorksSection(),
      processSection(),
      principlesSection(),
      contactSection(),
      footerSection(),
    ].join("");
    renderProjectGrid();
    renderContact();
    renderMinimap();
    renderDots();
    renderProcess(0);
    observeReveals();
    initCountUps();
    initPointerEffects();
    initLocalTime();
    initNavbar();
    initLoader();

    document.querySelectorAll("[data-filter]").forEach((b) => b.addEventListener("click", () => setState({ filter: b.dataset.filter })));
    document.addEventListener("click", (e) => {
      const open = e.target.closest?.("[data-open-project]");
      if (open) return openProject(open.dataset.openProject);
      const close = e.target.closest?.("[data-close-case]");
      if (close) closeProject(close.dataset.goto);
    });
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape" && state.openProject) closeProject();
    });

    on("filter", renderProjectGrid);
    on("submitted", (submitted) => city.onSubmitted?.(submitted));
    on("theme", (theme) => {
      document.documentElement.dataset.theme = theme;
      try {
        localStorage.setItem("mo-theme", theme);
      } catch {
        // Storage unavailable
      }
      updateThemeToggles();
      rebuildCity();
    });
    on("hovered", highlightCards);
    on("submitted", renderContact);
    on("entered", onEntered);
    on("entered", showThemeHint);
    on("activeSection", () => {
      updateNavActive();
      updateDots();
      updateMinimap();
    });
    on("simple", (simple) => {
      document.documentElement.dataset.simple = String(simple);
      try {
        localStorage.setItem("mo-simple", simple ? "1" : "0");
      } catch {
        // Storage unavailable
      }
      document.querySelectorAll("[data-simple-toggle]").forEach((b) => {
        b.setAttribute("aria-pressed", String(simple));
        b.setAttribute("aria-label", simple ? "Switch to 3D city view" : "Switch to simple view");
        b.title = simple ? "3D City View" : "Simple View";
        b.innerHTML = icon(simple ? "city" : "layers", "text-lg");
      });
      document.getElementById("city").hidden = simple;
      if (simple) city.running = false;
      else startCity();
      setupLenis();
      lockScroll();
      updateMinimap();
    });

    // Simple View is remembered, and is the default for visitors who prefer reduced motion
    let savedSimple = false;
    try {
      savedSimple = localStorage.getItem("mo-simple") === "1";
    } catch {
      // Storage unavailable
    }
    if (savedSimple || reducedMotion) setState({ simple: true, entered: true });
    else {
      startCity();
      setupLenis();
      lockScroll();
    }
    updateNavActive();
    updateDots();
    requestAnimationFrame(trackSections);
  </script>
</body>
</html>
